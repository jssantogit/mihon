name: 🐞 Issue report
description: Report an issue in Tsuzuki
labels: [bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide a concrete example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happened.
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Logs or diagnostics
      description: |
        If possible, attach the relevant Tsuzuki crash log, diagnostic report, or other output that helps reproduce the issue.

  - type: input
    id: tsuzuki-version
    attributes:
      label: Tsuzuki version
      description: Provide the version/build identifier shown by the app or the APK/workflow commit you tested.
      placeholder: |
        Example: "0.20.4 / commit abc1234"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: |
        Example: "Android 16"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: |
        Example: "Google Pixel 9"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Add screenshots, source/add-on details, or other context when relevant.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Please confirm these before submitting.
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I am testing the latest Tsuzuki build available to me for this development line.
          required: true
        - label: I have provided specific version/device information and reproduction steps.
          required: true
        - label: If this involves a third-party source or extension, I have identified which source/extension is involved and distinguished provider behavior from Tsuzuki behavior where possible.
          required: true
