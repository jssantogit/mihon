name: ⭐ Feature request
description: Suggest a feature to improve Tsuzuki
labels: [feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: How can Tsuzuki be improved?
      placeholder: |
        Example:
          "It should work like this..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details, references, or attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Please confirm these before submitting.
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: I have checked the current Tsuzuki roadmap/specs when the request overlaps planned work.
          required: true
        - label: I will provide enough detail to explain the intended user experience.
          required: true
