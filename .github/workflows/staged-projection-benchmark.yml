name: Staged chapter projection benchmark

on:
  push:
    branches:
      - tsuzuki/uc01-transactional-cutover
    paths:
      - 'domain/src/main/java/tachiyomi/domain/tsuzuki/chapter/evidence/**'
      - 'data/src/main/java/tachiyomi/data/tsuzuki/**'
      - 'data/src/main/sqldelight/tachiyomi/**'
      - 'data/src/test/java/tachiyomi/data/tsuzuki/ChapterEvidenceReconciliationBenchmarkTest.kt'
      - '.github/workflows/staged-projection-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-projection-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Measure staged projection on SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run equivalent 100/500/1000 staged-projection workload
        env:
          TSUZUKI_STAGED_PROJECTION_BENCHMARK: 'true'
          TSUZUKI_BENCHMARK_LABEL: ${{ github.sha }}
        run: ./gradlew :data:testDebugUnitTest --tests tachiyomi.data.tsuzuki.ChapterEvidenceReconciliationBenchmarkTest
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-projection-benchmark-${{ github.sha }}
          path: data/build/reports/tsuzuki/staged-projection-benchmark.txt
          if-no-files-found: ignore
          retention-days: 3
