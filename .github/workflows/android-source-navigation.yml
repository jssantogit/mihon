name: Android canonical source navigation

on:
  workflow_dispatch:
    inputs:
      run_android_navigation:
        description: 'Opt in to isolated Reader/MainActivity navigation instrumentation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile navigation instrumentation and verify runner contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check verifier and runner script contracts
        run: |
          python3 .github/scripts/test_verify_android_navigation_instrumentation.py
          bash -n .github/scripts/run_android_navigation.sh
      - name: Compile instrumentation without launching an emulator
        run: ./gradlew :app:compileDebugAndroidTestKotlin
      - name: Require the three named JUnit4 methods
        run: |
          set -euo pipefail
          class='CanonicalTitleSourceNavigationInstrumentedTest'
          class_file="$(find app/build -type f -name "${class}.class" -print -quit)"
          test -n "$class_file"
          suffix="/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/${class}.class"
          class_dir="${class_file%$suffix}"
          fqcn="eu.kanade.tachiyomi.data.tsuzuki.instrumentation.${class}"
          javap -classpath "$class_dir" "$fqcn" > junit-signatures.txt
          grep -F 'public final void coldReaderDiscoveryOpensCanonicalTitleBindingSheetOnce();' junit-signatures.txt
          grep -F 'public final void warmReaderDiscoveryReusesMainActivityAndOpensCanonicalTitleBindingSheetOnce();' junit-signatures.txt
          grep -F 'public final void invalidDiscoveryIntentDoesNotOpenTitleOrMutateProgressAndPreferences();' junit-signatures.txt

  emulator:
    name: Run offline navigation tests with disposable app data
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_navigation == true
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Enable KVM for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the real Android activities offline
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_android_navigation.sh
      - name: Upload sanitized navigation and cleanup reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-navigation-${{ github.sha }}
          path: .github/results/android-navigation/**
          if-no-files-found: ignore
          retention-days: 3
