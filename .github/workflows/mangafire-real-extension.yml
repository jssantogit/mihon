name: MangaFire real-extension Android test

on:
  push:
    branches:
      - tsuzuki/runtime-e2e-tests
    paths:
      - 'test-fixtures/extensions/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/scripts/verify_extension_fixture.py'
      - '.github/scripts/run_mangafire_android.sh'
      - '.github/scripts/verify_android_instrumentation.py'
      - '.github/scripts/test_android_instrumentation.py'
      - '.github/scripts/summarize_android_instrumentation.py'
      - '.github/scripts/test_summarize_android_instrumentation.py'
      - '.github/scripts/test_extension_fixture.py'
      - '.github/workflows/mangafire-real-extension.yml'
  workflow_dispatch:
    inputs:
      live_probe:
        description: 'Explicitly permit one real One Punch Man search against MangaFire (not deterministic)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mangafire-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: Verify immutable extension fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fixture and regression tests
        run: |
          python3 .github/scripts/test_extension_fixture.py
          python3 .github/scripts/test_android_instrumentation.py
          python3 .github/scripts/test_summarize_android_instrumentation.py
          bash -n .github/scripts/run_mangafire_android.sh
          python3 .github/scripts/verify_extension_fixture.py

  compile-android-test:
    name: Compile real-extension instrumentation
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile instrumentation sources (no emulator or live requests)
        run: ./gradlew :app:compileDebugAndroidTestKotlin
      - name: Verify JUnit methods have JVM void signatures
        run: |
          set -euo pipefail
          class_file="$(find app/build -type f -name 'MangaFireFixtureInstrumentedTest.class' -print -quit)"
          test -n "$class_file"
          suffix='/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/MangaFireFixtureInstrumentedTest.class'
          class_dir="${class_file%$suffix}"
          class="eu.kanade.tachiyomi.data.tsuzuki.instrumentation.MangaFireFixtureInstrumentedTest"
          javap -classpath "$class_dir" "$class" > junit-signatures.txt
          grep -F 'public final void loadsRealExtensionAndRegistersInternalSources();' junit-signatures.txt
          grep -F 'public final void optionalLiveEnglishSearch();' junit-signatures.txt

  emulator:
    name: Load real APK in isolated emulator
    # Opt in via manual dispatch or an explicit test-only commit marker.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[android-fixture]'))
    needs: compile-android-test
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify APK fixture
        run: python3 .github/scripts/verify_extension_fixture.py
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated Android instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The emulator action runs individual YAML script lines in separate shells.
          # Keep setup and conditional logic within ONE invoked Bash script.
          script: bash .github/scripts/run_mangafire_android.sh "${{ inputs.live_probe }}"
      - name: Upload sanitized instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mangafire-instrumentation-${{ github.sha }}
          path: .github/results/mangafire/**
          if-no-files-found: ignore
          retention-days: 3
