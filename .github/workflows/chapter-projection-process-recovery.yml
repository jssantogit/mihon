name: Chapter projection process recovery

on:
  push:
    branches:
      - tsuzuki/uc01-transactional-cutover
    paths:
      - 'app/src/androidTest/java/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/CanonicalReadingProcessRecoveryInstrumentedTest.kt'
      - 'data/src/main/java/tachiyomi/data/tsuzuki/CanonicalReadingRepositoryImpl.kt'
      - 'data/src/main/sqldelight/tachiyomi/data/tsuzuki_mihon_projection_queue.sq'
      - 'data/src/main/sqldelight/tachiyomi/migrations/33.sqm'
      - 'data/src/test/java/tachiyomi/data/tsuzuki/CanonicalReadingRepositoryImplTest.kt'
      - '.github/scripts/run_android_process_recovery.sh'
      - '.github/scripts/verify_android_process_recovery.py'
      - '.github/scripts/test_verify_android_process_recovery.py'
      - '.github/workflows/chapter-projection-process-recovery.yml'

permissions:
  contents: read

concurrency:
  group: cr02-process-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: Verify recovery evidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test fail-closed PID and instrumentation verification
        run: |
          python3 .github/scripts/test_verify_android_process_recovery.py
          python3 -m py_compile .github/scripts/verify_android_process_recovery.py
          bash -n .github/scripts/run_android_process_recovery.sh

  data:
    name: Migration 33 and transactional queue tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run migration-33 queue regressions
        run: ./gradlew :data:testDebugUnitTest --tests 'tachiyomi.data.tsuzuki.CanonicalReadingRepositoryImplTest'
      - name: Verify SQLDelight migration chain
        run: ./gradlew verifySqlDelightMigration

  emulator:
    name: Recover pending projection after real process stop
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Compile target and Android instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run two-phase recovery on disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_android_process_recovery.sh
      - name: Upload sanitized process-recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cr02-process-recovery-${{ github.sha }}
          path: .github/results/android-process-recovery/**
          if-no-files-found: ignore
          retention-days: 3
