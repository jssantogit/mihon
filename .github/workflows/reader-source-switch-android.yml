name: Reader source switch Android test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-source-switch-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Execute synthetic Reader source switches on disposable emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate fail-closed result verifier
        run: |
          python3 .github/scripts/test_verify_android_reader_source_switch.py
          bash -n .github/scripts/run_android_reader_source_switch.sh
      - name: Assemble isolated debug app and instrumented tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Confirm required test methods exist in compiled instrumentation
        run: |
          set -euo pipefail
          class='CanonicalReaderSourceSwitchInstrumentedTest'
          class_file="$(find app/build -type f -name "${class}.class" -print -quit)"
          test -n "$class_file"
          suffix="/eu/kanade/tachiyomi/data/tsuzuki/instrumentation/${class}.class"
          class_dir="${class_file%$suffix}"
          fqcn='eu.kanade.tachiyomi.data.tsuzuki.instrumentation.CanonicalReaderSourceSwitchInstrumentedTest'
          javap -classpath "$class_dir" "$fqcn" > reader-source-switch-junit-signatures.txt
          grep -F 'public final void sourceAtoBLoadsPagesAndPreservesCanonicalChapterAndObservedPosition();' reader-source-switch-junit-signatures.txt
          grep -F 'public final void emptyOrFailingSourceKeepsPreviouslyLoadedReaderSession();' reader-source-switch-junit-signatures.txt
          grep -F 'public final void pageCountDifferenceClampsPositionToValidPage();' reader-source-switch-junit-signatures.txt
          grep -F 'public final void retiredSourceCallbackCannotChangePublishedSession();' reader-source-switch-junit-signatures.txt
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline synthetic source-switch instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run_android_reader_source_switch.sh
      - name: Upload sanitized Reader source-switch results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-source-switch-${{ github.sha }}
          path: .github/results/android-reader-source-switch/**
          if-no-files-found: ignore
          retention-days: 3
